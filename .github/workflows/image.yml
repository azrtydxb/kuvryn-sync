name: Image

# push covers main (and release tags); pull_request covers every other
# branch. An unfiltered push trigger ran each PR commit twice (#1).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Integration tier: the image is built/published nightly too. It is never
  # built for an untrusted pull request.
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch: {}

# Main and tag runs publish, so only superseded pull request runs are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  # Nightly only: skip the run when main has not changed since the last
  # successful run (see .github/scripts/nightly-gate.py). Pushes, tags,
  # dispatches and pull requests never wait on it.
  gate:
    if: github.event_name == 'schedule'
    runs-on: arc-azrtydxb-amd64
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: image.yml
          RUN_EVENT: ""
        run: python3 .github/scripts/nightly-gate.py

  image:
    # Off the PR path: publishing the controller image is integration work.
    # It still runs on push to main and on v* tags (the publish path), and
    # nightly unless main is unchanged (gate).
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && github.event_name != 'pull_request' }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write # Kuvryn Ant OIDC (azrtydxb/ant-setup-action)
    name: Build controller image
    # The kw publish runners are native arm64 and reach the real ghcr.io. Pull
    # requests from forks run untrusted code, so they get GitHub-hosted runners.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'arc-azrtydxb' || 'ubuntu-latest' }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azrtydxb/ant-setup-action@61489bff507f23c248496a096d97de05e1d6e3fd # v1

      # On the ARC runners the image builds on the runner pod's rootless
      # BuildKit sidecar (native linux/arm64), which pushes with the docker
      # login below.
      - name: Set up the BuildKit sidecar builder
        id: builder
        if: runner.environment == 'self-hosted'
        uses: azrtydxb/.github/actions/setup-builder@a6fb8e66bd50b411a1f20b826567ef320aec469b # main

      # Only the GitHub-hosted fallback is amd64 and needs arm64 emulation.
      - name: Set up QEMU
        if: runner.environment != 'self-hosted'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v3.6.0

      - name: Set up Docker Buildx
        id: buildx
        if: runner.environment != 'self-hosted'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Branch names may contain '/', which is not valid in an image tag.
      - name: Compute the branch tag
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "branch=${REF_NAME//[^a-zA-Z0-9_.-]/-}" >> "$GITHUB_OUTPUT"

      # The binary reports this version: the tag on a release, the commit
      # otherwise.
      - name: Compute the build version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          # On a pull request github.sha is the ephemeral merge commit.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # Ant's BuildKit registry cache: the npm and go mod layers survive between
      # runs (the runner pod's own BuildKit store does not). Also logs in to Ant.
      - id: ant-cache
        uses: azrtydxb/ant-setup-action@61489bff507f23c248496a096d97de05e1d6e3fd # v1
        with:
          build-cache: "true"
          cache-name: sync-image
          arch-suffix: arm64
          sccache: "false"
          go: "false"
          npm: "false"
          cargo: "false"
          pip: "false"

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          builder: ${{ steps.builder.outputs.name || steps.buildx.outputs.name }}
          platforms: linux/arm64
          push: true
          cache-from: ${{ steps.ant-cache.outputs.cache-from }}
          cache-to: ${{ steps.ant-cache.outputs.cache-to }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/kuvryn-sync:${{ steps.tag.outputs.branch }}
            ghcr.io/${{ github.repository_owner }}/kuvryn-sync:sha-${{ github.sha }}
