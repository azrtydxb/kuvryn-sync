name: Image

# push covers main (and release tags); pull_request covers every other
# branch. An unfiltered push trigger ran each PR commit twice (#1).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Main and tag runs publish, so only superseded pull request runs are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  image:
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    name: Build controller image
    # The kw publish runners are native arm64 and reach the real ghcr.io. Pull
    # requests from forks run untrusted code, so they get GitHub-hosted runners.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'arc-azrtydxb-publish' || 'ubuntu-latest' }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Only the GitHub-hosted fallback is amd64 and needs arm64 emulation.
      - name: Set up QEMU
        if: runner.arch != 'ARM64'
        uses: docker/setup-qemu-action@e77e8065d9f7ec6abdd9838668cd7b43924dd64d # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Login to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Branch names may contain '/', which is not valid in an image tag.
      - name: Compute the branch tag
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "branch=${REF_NAME//[^a-zA-Z0-9_.-]/-}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.branch }}
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
