name: Lint

# push covers main; pull_request covers every other branch. An unfiltered push trigger ran each PR commit twice (#1).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Kuvryn Ant OIDC (azrtydxb/ant-setup-action)
    name: Run on Ubuntu
    # Pull requests from forks run untrusted code, so they get GitHub-hosted
    # runners; the lab runners sit on the internal network.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'arc-azrtydxb' || 'ubuntu-latest' }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: azrtydxb/ant-setup-action@7c6f1b8ca34a0a127b43040f4e16bbafdbd83791 # v1

      - name: Install make
        run: command -v make >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq make; }

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint
      - name: Check documentation links
        run: make docs-check
