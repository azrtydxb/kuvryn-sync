name: UI

# push covers main; pull_request covers every other branch. An unfiltered push trigger ran each PR commit twice (#1).
on:
  push:
    branches: [main]
  pull_request:
  # Full tier (browser e2e): the Playwright console suite runs nightly / on
  # demand, never on a PR.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Nightly only: skip the run when main has not changed since the last
  # successful run (see .github/scripts/nightly-gate.py). Pushes, tags,
  # dispatches and pull requests never wait on it.
  gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: test-ui.yml
          RUN_EVENT: schedule
        run: python3 .github/scripts/nightly-gate.py

  test-ui:
    # Kept off the pull request path: the Playwright/Chromium run is the full
    # tier, so it runs on the nightly schedule and on demand.
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Kuvryn Ant OIDC (azrtydxb/ant-setup-action)
    name: Console Playwright tests
    # GitHub-hosted native arm64 runner (public repo).
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Clone the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: azrtydxb/ant-setup-action@v1

      - name: Install make
        run: command -v make >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq make; }

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the UI dependencies and Chromium
        run: |
          npm --prefix web ci
          npx --prefix web playwright install --with-deps chromium

      - name: Install the envtest binaries
        run: make setup-envtest

      - name: Run the Playwright tests
        env:
          CI: "true"
        run: make test-ui

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
