name: UI

# push covers main; pull_request covers every other branch. An unfiltered push trigger ran each PR commit twice (#1).
on:
  push:
    branches: [main]
  pull_request:
  # Full tier (browser e2e): the Playwright console suite runs nightly / on
  # demand, never on a PR.
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test-ui:
    # Kept off the pull request path: the Playwright/Chromium run is the full
    # tier, so it runs on the nightly schedule and on demand.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Kuvryn Ant OIDC (azrtydxb/ant-setup-action)
    name: Console Playwright tests
    # Pull requests from forks run untrusted code, so they get GitHub-hosted
    # runners; the lab runners sit on the internal network.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'arc-azrtydxb' || 'ubuntu-latest' }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azrtydxb/ant-setup-action@7c6f1b8ca34a0a127b43040f4e16bbafdbd83791 # v1

      - name: Install make
        run: command -v make >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq make; }

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the UI dependencies and Chromium
        run: |
          npm --prefix web ci
          npx --prefix web playwright install --with-deps chromium

      - name: Install the envtest binaries
        run: make setup-envtest

      - name: Run the Playwright tests
        env:
          CI: "true"
        run: make test-ui

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
