name: E2E Tests

# push covers main; pull_request covers every other branch. An unfiltered push trigger ran each PR commit twice (#1).
on:
  push:
    branches: [main]
  pull_request:
  # Integration tier: the kind e2e runs nightly / on demand, never on a PR.
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # Kuvryn Ant OIDC (azrtydxb/ant-setup-action)

env:
  IMG: kuvryn-sync:e2e-${{ github.sha }}

jobs:
  # Nightly only: skip the run when main has not changed since the last
  # successful run (see .github/scripts/nightly-gate.py). Pushes, tags,
  # dispatches and pull requests never wait on it.
  gate:
    if: github.event_name == 'schedule'
    runs-on: arc-azrtydxb-amd64
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: test-e2e.yml
          RUN_EVENT: schedule
        run: python3 .github/scripts/nightly-gate.py

  test-e2e:
    # Kept off the pull request path: kind + a full image build is the
    # integration tier, so it runs on the nightly schedule and on demand.
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    timeout-minutes: 45
    name: Run on Kind
    # Pull requests from forks run untrusted code, so they get GitHub-hosted
    # runners; the lab runners sit on the internal network.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'arc-azrtydxb' || 'ubuntu-latest' }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azrtydxb/ant-setup-action@7c6f1b8ca34a0a127b43040f4e16bbafdbd83791 # v1

      - name: Install make
        run: command -v make >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq make; }

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kubectl
        run: |
          KUBECTL_VERSION=v1.35.1
          base="https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/$(go env GOARCH)"
          curl -fsSLo kubectl "${base}/kubectl"
          echo "$(curl -fsSL "${base}/kubectl.sha256")  kubectl" | sha256sum -c -
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          rm kubectl

      # Pinned (and checksummed) so a kind release cannot change the node image
      # or behaviour under the nightly.
      - name: Install kind
        run: |
          KIND_VERSION=v0.33.0
          arch="$(go env GOARCH)"
          case "$arch" in
            arm64) sum=20022bee6cfcd5086cb7234d218e3454e6090022f2a8f55d1fa7fcf42c3867a2 ;;
            amd64) sum=aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d ;;
            *) echo "unsupported architecture $arch" >&2; exit 1 ;;
          esac
          curl -fsSLo ./kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-${arch}"
          echo "${sum}  kind" | sha256sum -c -
          sudo install -m 0755 ./kind /usr/local/bin/kind
          rm ./kind

      - name: Verify kind installation
        run: kind version

      - name: Build e2e image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMG }}

      # The steps below are make test-e2e split up, so the cluster outlives a
      # failed run long enough to collect diagnostics.
      - name: Create the Kind cluster
        run: |
          go mod tidy
          # --retain keeps a node that fails to boot so its logs can be read.
          kind create cluster --name kuvryn-sync-test-e2e --retain || {
            docker info --format 'cgroup {{.CgroupVersion}} driver {{.CgroupDriver}}' || true
            docker logs kuvryn-sync-test-e2e-control-plane 2>&1 | tail -60 || true
            exit 1
          }
          make setup-test-e2e manifests generate
          # Inside a pod, kubectl falls back to the pod's service-account
          # namespace (arc-runners) when the context names none; the suite
          # expects default.
          kubectl config set-context --current --namespace=default
          kind load docker-image "$IMG" --name kuvryn-sync-test-e2e

      - name: Running Test e2e
        run: IMG="$IMG" KIND_CLUSTER=kuvryn-sync-test-e2e go test -tags=e2e ./test/e2e/ -v -ginkgo.v

      - name: Collect cluster diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -80 || true
          kubectl -n cert-manager describe pods | tail -120 || true

      - name: Delete the Kind cluster
        if: always()
        run: kind delete cluster --name kuvryn-sync-test-e2e || true
