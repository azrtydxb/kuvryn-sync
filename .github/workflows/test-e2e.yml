name: E2E Tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMG: solder:e2e-${{ github.sha }}

jobs:
  test-e2e:
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    name: Run on Kind
    runs-on: arc-azrtydxb
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install make
        run: command -v make >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq make; }

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install kubectl
        run: |
          KUBECTL_VERSION=v1.35.1
          base="https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/$(go env GOARCH)"
          curl -fsSLo kubectl "${base}/kubectl"
          echo "$(curl -fsSL "${base}/kubectl.sha256")  kubectl" | sha256sum -c -
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          rm kubectl

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Build e2e image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMG }}

      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e IMG="$IMG" KIND_LOAD_IMAGE=true
