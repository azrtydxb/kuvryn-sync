name: Tests

# push covers main; pull_request covers every other branch. An unfiltered push trigger ran each PR commit twice (#1).
# Documentation-only changes skip the suite; lint (make docs-check) still runs
# and reports the required "Run on Ubuntu" check.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Kuvryn Ant OIDC (azrtydxb/ant-setup-action)
    name: Run on Ubuntu
    # Pull requests from forks run untrusted code, so they get GitHub-hosted
    # runners; the lab runners sit on the internal network.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'arc-azrtydxb' || 'ubuntu-latest' }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azrtydxb/ant-setup-action@7c6f1b8ca34a0a127b43040f4e16bbafdbd83791 # v1

      - name: Install make
        run: command -v make >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq make; }

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the console UI
        run: npm --prefix web ci && npm --prefix web run typecheck && npm --prefix web test && npm --prefix web run build

      - name: Running Tests
        run: |
          go mod tidy
          make test
