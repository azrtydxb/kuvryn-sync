name: Tests

# push covers main; pull_request covers every other branch. An unfiltered push trigger ran each PR commit twice (#1).
# Documentation-only changes skip the suite; lint (make docs-check) still runs
# and reports the required "Run on Ubuntu" check.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Kuvryn Ant OIDC (azrtydxb/ant-setup-action)
    name: Run on Ubuntu
    # GitHub-hosted native arm64 runner (public repo).
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Clone the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: azrtydxb/ant-setup-action@v1

      - name: Install make
        run: command -v make >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq make; }

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the console UI
        run: npm --prefix web ci && npm --prefix web run typecheck && npm --prefix web test && npm --prefix web run build

      - name: Running Tests
        run: |
          go mod tidy
          make test
