---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: imagepolicies.sync.kuvryn.io
spec:
  group: sync.kuvryn.io
  names:
    kind: ImagePolicy
    listKind: ImagePolicyList
    plural: imagepolicies
    singular: imagepolicy
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.latestImage
          name: Image
          type: string
        - jsonPath: .status.lastScannedAt
          name: Scanned
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description:
            ImagePolicy scans an image repository and selects the image to
            run.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: spec defines the desired state of ImagePolicy
              properties:
                image:
                  description: image is the image repository to scan, such as ghcr.io/acme/api.
                  minLength: 1
                  type: string
                interval:
                  default: 5m
                  description: interval is how often the registry is scanned.
                  type: string
                policy:
                  description: policy decides which image is selected.
                  properties:
                    digest:
                      description:
                        digest follows the current digest of one fixed tag,
                        such as main.
                      properties:
                        tag:
                          description: tag is the tag whose current digest is selected.
                          minLength: 1
                          type: string
                      required:
                        - tag
                      type: object
                    semver:
                      description:
                        semver selects the highest tag within a semantic
                        version range.
                      properties:
                        range:
                          description:
                            range is a semver constraint such as ">=1.2.0
                            <2.0.0".
                          minLength: 1
                          type: string
                      required:
                        - range
                      type: object
                    tagPattern:
                      description: |-
                        tagPattern selects the last tag matching a regular expression, in the
                        given order.
                      properties:
                        order:
                          default: alphabetical
                          description: |-
                            order sorts matching tags: alphabetical or numerical (by the first
                            capture group, or the whole tag). The last tag in order is selected.
                          enum:
                            - alphabetical
                            - numerical
                          type: string
                        regex:
                          description: regex matches candidate tags.
                          minLength: 1
                          type: string
                      required:
                        - regex
                      type: object
                  type: object
                  x-kubernetes-validations:
                    - message: set exactly one of semver, tagPattern, or digest
                      rule:
                        "(has(self.semver) ? 1 : 0) + (has(self.tagPattern) ? 1 :
                        0) + (has(self.digest) ? 1 : 0) == 1"
                secretRef:
                  description: |-
                    secretRef names a kubernetes.io/dockerconfigjson Secret, labelled
                    sync.kuvryn.io/registry-credentials=true, used to read the registry.
                  properties:
                    name:
                      description: name is the Secret name.
                      minLength: 1
                      type: string
                  required:
                    - name
                  type: object
                webhook:
                  description: |-
                    webhook lets a registry or CI trigger an immediate scan through
                    Kuvryn Sync's receiver at /hooks/imagepolicies/<namespace>/<name>.
                  properties:
                    secretRef:
                      description: |-
                        secretRef names a Secret whose `token` authenticates requests, as a
                        GitHub signature, a GitLab token, or an Authorization Bearer token.
                      properties:
                        name:
                          description: name is the Secret name.
                          minLength: 1
                          type: string
                      required:
                        - name
                      type: object
                  required:
                    - secretRef
                  type: object
              required:
                - image
                - policy
              type: object
            status:
              description: status defines the observed state of ImagePolicy
              properties:
                conditions:
                  description: conditions represent the state of the policy.
                  items:
                    description:
                      Condition contains details for one aspect of the current
                      state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                lastScannedAt:
                  description: lastScannedAt is when the registry was last read successfully.
                  format: date-time
                  type: string
                latestDigest:
                  description: latestDigest is the selected tag's manifest digest.
                  type: string
                latestImage:
                  description: latestImage is the immutable reference image:tag@digest.
                  type: string
                latestTag:
                  description: latestTag is the selected tag.
                  type: string
                observedGeneration:
                  description:
                    observedGeneration is the latest metadata.generation
                    processed.
                  format: int64
                  type: integer
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
