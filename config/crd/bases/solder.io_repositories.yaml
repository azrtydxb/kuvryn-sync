---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: repositories.solder.io
spec:
  group: solder.io
  names:
    kind: Repository
    listKind: RepositoryList
    plural: repositories
    shortNames:
      - repo
      - repos
    singular: repository
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.state
          name: State
          type: string
        - jsonPath: .status.observedRevision
          name: Revision
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: Repository is a desired-state source and its authentication configuration.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: spec defines the desired source configuration.
              properties:
                applicationConfigPaths:
                  description: |-
                    applicationConfigPaths are repository-relative .solder.yaml files that
                    declare Applications for this Repository. When empty, Solder reads
                    .solder.yaml from the repository root.
                  items:
                    type: string
                  type: array
                  x-kubernetes-list-type: atomic
                applicationServiceAccountName:
                  description: |-
                    applicationServiceAccountName is the service account that Applications
                    discovered from .solder.yaml run as. Discovered Applications may only
                    name this account; when it is empty they may not set serviceAccountName
                    and use the controller's default service account.
                  maxLength: 253
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                  type: string
                git:
                  description: git configures a Git desired-state source.
                  properties:
                    auth:
                      description: auth references credentials for private repositories.
                      properties:
                        secretRef:
                          description:
                            secretRef references a Secret in the Repository
                            namespace.
                          properties:
                            name:
                              description: name is the Secret name.
                              minLength: 1
                              type: string
                          required:
                            - name
                          type: object
                      type: object
                    revision:
                      description: |-
                        revision is the default branch, tag, or exact commit used by Applications
                        that do not specify their own source revision.
                      type: string
                    url:
                      description:
                        url is the Git remote URL. HTTPS and SSH are supported
                        by the first API.
                      minLength: 1
                      type: string
                  required:
                    - url
                  type: object
                pollInterval:
                  description:
                    pollInterval controls source polling when no external
                    wake-up signal exists.
                  type: string
                type:
                  default: git
                  description: type selects the desired-state source adapter.
                  enum:
                    - git
                  type: string
                webhook:
                  description: |-
                    webhook lets GitHub or GitLab push events trigger an immediate fetch
                    through Solder's webhook receiver at /hooks/<namespace>/<name>.
                  properties:
                    secretRef:
                      description: |-
                        secretRef names a Secret in the Repository namespace whose `token` is the
                        webhook secret configured on GitHub (HMAC) or GitLab (token).
                      properties:
                        name:
                          description: name is the Secret name.
                          minLength: 1
                          type: string
                      required:
                        - name
                      type: object
                  required:
                    - secretRef
                  type: object
              type: object
            status:
              description: status defines the observed source state.
              properties:
                conditions:
                  description:
                    conditions represent the current state of the Repository
                    resource.
                  items:
                    description:
                      Condition contains details for one aspect of the current
                      state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                lastFetchedAt:
                  description:
                    lastFetchedAt records the last successful source fetch/inspection
                    time.
                  format: date-time
                  type: string
                observedRevision:
                  description:
                    observedRevision is the latest resolved source revision
                    Solder observed.
                  type: string
                state:
                  description: state is the high-level observed readiness of the source.
                  enum:
                    - Unknown
                    - Ready
                    - Failed
                  type: string
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
