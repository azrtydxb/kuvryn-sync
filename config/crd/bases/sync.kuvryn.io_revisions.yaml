---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: revisions.sync.kuvryn.io
spec:
  group: sync.kuvryn.io
  names:
    kind: Revision
    listKind: RevisionList
    plural: revisions
    shortNames:
      - rev
      - revs
    singular: revision
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .spec.applicationRef.name
          name: Application
          type: string
        - jsonPath: .spec.source.revision
          name: Revision
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: Revision is an auditable, bounded record of one deployment attempt.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: spec defines immutable deployment attempt identity.
              properties:
                applicationRef:
                  description:
                    applicationRef references the Application that owns this
                    deployment attempt.
                  properties:
                    name:
                      description: name is the referenced object name.
                      minLength: 1
                      type: string
                  required:
                    - name
                  type: object
                desiredStateHash:
                  description:
                    desiredStateHash is a deterministic fingerprint of rendered
                    desired state.
                  type: string
                source:
                  description:
                    source records the exact desired-state source used for
                    this attempt.
                  properties:
                    path:
                      description:
                        path is the repository-relative path rendered for
                        this Revision.
                      type: string
                    render:
                      description:
                        render records the render configuration used for
                        this Revision.
                      properties:
                        helm:
                          description: helm configures Helm rendering when type is helm.
                          properties:
                            chart:
                              description: |-
                                chart pulls a pinned chart from a Helm (https) or OCI (oci://)
                                repository instead of rendering source.path as a chart.
                              properties:
                                name:
                                  description: name is the chart name.
                                  minLength: 1
                                  type: string
                                repository:
                                  description:
                                    repository is an https chart repository
                                    URL or an oci:// registry path.
                                  pattern: ^(https|oci)://
                                  type: string
                                secretRef:
                                  description: |-
                                    secretRef names a Secret, labelled sync.kuvryn.io/registry-credentials=true,
                                    with `username` and `password` for the repository.
                                  properties:
                                    name:
                                      description: name is the Secret name.
                                      minLength: 1
                                      type: string
                                  required:
                                    - name
                                  type: object
                                version:
                                  description:
                                    version is the exact chart version to
                                    pull.
                                  minLength: 1
                                  type: string
                              required:
                                - name
                                - repository
                                - version
                              type: object
                            releaseName:
                              description: |-
                                releaseName is the Helm release name used for template rendering. Like
                                Helm, it must be a lowercase DNS subdomain of at most 53 characters.
                                Empty means the default, kuvryn-sync.
                              maxLength: 53
                              pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*)?$
                              type: string
                            values:
                              description:
                                values are merged last, over every other
                                source.
                              type: object
                              x-kubernetes-preserve-unknown-fields: true
                            valuesFiles:
                              description:
                                valuesFiles are repository-relative values
                                files.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                            valuesFrom:
                              description: |-
                                valuesFrom merges values from ConfigMaps and Secrets in the Application
                                namespace, read as the Application's service account, after valuesFiles.
                              items:
                                description:
                                  HelmValuesReference names values stored
                                  in a ConfigMap or Secret.
                                properties:
                                  key:
                                    description:
                                      key holds a YAML values document; it
                                      defaults to values.yaml.
                                    type: string
                                  kind:
                                    description: kind is ConfigMap or Secret.
                                    enum:
                                      - ConfigMap
                                      - Secret
                                    type: string
                                  name:
                                    description:
                                      name is the object name in the Application
                                      namespace.
                                    minLength: 1
                                    type: string
                                required:
                                  - kind
                                  - name
                                type: object
                              maxItems: 16
                              type: array
                              x-kubernetes-list-type: atomic
                          type: object
                        type:
                          description: type identifies the renderer.
                          enum:
                            - yaml
                            - kustomize
                            - helm
                          type: string
                      required:
                        - type
                      type: object
                    repositoryRef:
                      description:
                        repositoryRef references the Repository used for
                        this Revision.
                      properties:
                        name:
                          description: name is the referenced object name.
                          minLength: 1
                          type: string
                      required:
                        - name
                      type: object
                    revision:
                      description:
                        revision is the resolved source revision, usually
                        a full Git commit SHA.
                      minLength: 1
                      type: string
                  required:
                    - render
                    - repositoryRef
                    - revision
                  type: object
              required:
                - applicationRef
                - source
              type: object
            status:
              description: status defines observed lifecycle, plan, and health state.
              properties:
                approval:
                  description: |-
                    approval records who approved this Revision's plan, when it was applied
                    through manual approval.
                  properties:
                    approvedAt:
                      description: approvedAt is when the approval was admitted.
                      format: date-time
                      type: string
                    approvedBy:
                      description:
                        approvedBy is the authenticated user who approved
                        the plan.
                      type: string
                    desiredStateHash:
                      description: |-
                        desiredStateHash is the desired state the approved plan was built from.
                        The approval covers the rest of this Revision's rollout only while the
                        desired state still has this hash.
                      type: string
                    planDigest:
                      description:
                        planDigest is the plan digest the approval was given
                        for.
                      type: string
                  required:
                    - approvedAt
                    - approvedBy
                    - planDigest
                  type: object
                attempts:
                  description:
                    attempts counts reconciliation attempts for retry-loop
                    protection.
                  format: int32
                  minimum: 0
                  type: integer
                chartDigest:
                  description: |-
                    chartDigest is the sha256 of the Helm chart archive pulled from a chart
                    repository for this Revision.
                  type: string
                completedAt:
                  description:
                    completedAt records when this Revision reached a terminal
                    phase.
                  format: date-time
                  type: string
                conditions:
                  description:
                    conditions represent the current state of the Revision
                    resource.
                  items:
                    description:
                      Condition contains details for one aspect of the current
                      state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                deployedDesiredStateHash:
                  description: |-
                    deployedDesiredStateHash is the desired-state hash this Revision's last
                    completed, Healthy rollout deployed. spec.desiredStateHash follows every
                    render, including drift checks that deploy nothing; a manual rollback
                    to this Revision approves only this desired state.
                  type: string
                failure:
                  description:
                    failure records the most recent deterministic failure
                    classification.
                  properties:
                    message:
                      description: message is a concise human-readable explanation.
                      type: string
                    reason:
                      description:
                        reason is a stable category such as RenderFailure
                        or HealthFailure.
                      type: string
                    resource:
                      description: resource identifies the affected resource when applicable.
                      properties:
                        apiVersion:
                          description:
                            apiVersion is the resource API version, such
                            as apps/v1.
                          minLength: 1
                          type: string
                        kind:
                          description: kind is the Kubernetes resource kind.
                          minLength: 1
                          type: string
                        name:
                          description: name is the resource name.
                          minLength: 1
                          type: string
                        namespace:
                          description: namespace is empty for cluster-scoped resources.
                          type: string
                      required:
                        - apiVersion
                        - kind
                        - name
                      type: object
                    retryable:
                      description:
                        retryable indicates whether retrying the same desired
                        revision can help.
                      type: boolean
                  type: object
                health:
                  description: health summarizes health observed for this attempt.
                  properties:
                    degraded:
                      format: int32
                      minimum: 0
                      type: integer
                    healthy:
                      format: int32
                      minimum: 0
                      type: integer
                    progressing:
                      format: int32
                      minimum: 0
                      type: integer
                    total:
                      format: int32
                      minimum: 0
                      type: integer
                    unknown:
                      format: int32
                      minimum: 0
                      type: integer
                  type: object
                hooks:
                  description:
                    hooks reports the pre-sync and post-sync hooks run for
                    this Revision.
                  items:
                    description: HookStatus is the state of one sync hook.
                    properties:
                      message:
                        description: message explains the state.
                        type: string
                      resource:
                        description: resource identifies the hook object.
                        properties:
                          apiVersion:
                            description:
                              apiVersion is the resource API version, such
                              as apps/v1.
                            minLength: 1
                            type: string
                          kind:
                            description: kind is the Kubernetes resource kind.
                            minLength: 1
                            type: string
                          name:
                            description: name is the resource name.
                            minLength: 1
                            type: string
                          namespace:
                            description: namespace is empty for cluster-scoped resources.
                            type: string
                        required:
                          - apiVersion
                          - kind
                          - name
                        type: object
                      stage:
                        description: stage is PreSync or PostSync.
                        type: string
                      state:
                        description: |-
                          state is the hook's health: Progressing while it runs, Healthy once it
                          succeeded, Degraded when it failed.
                        type: string
                    required:
                      - resource
                      - stage
                      - state
                    type: object
                  maxItems: 64
                  type: array
                  x-kubernetes-list-type: atomic
                phase:
                  description: phase is the lifecycle state of this deployment attempt.
                  enum:
                    - Pending
                    - Planning
                    - AwaitingApproval
                    - Applying
                    - Observing
                    - Healthy
                    - Failed
                    - RollingBack
                    - RolledBack
                    - Cancelled
                  type: string
                plan:
                  description: plan stores bounded, redacted deployment plan details.
                  properties:
                    digest:
                      description: |-
                        digest identifies the complete plan and desired state; an approval is
                        valid only for the digest it was given for.
                      type: string
                    resources:
                      description:
                        resources is intentionally bounded by the planner
                        before it is written.
                      items:
                        description:
                          PlanResourceChange describes one resource in a
                          deployment plan.
                        properties:
                          action:
                            description:
                              PlanAction classifies the change for a planned
                              resource.
                            enum:
                              - Create
                              - Update
                              - Delete
                              - Unchanged
                            type: string
                          changes:
                            items:
                              description:
                                PlanFieldChange captures a redacted, machine-readable
                                field-level change.
                              properties:
                                after:
                                  description:
                                    after is a safe string representation
                                    of the desired value.
                                  type: string
                                before:
                                  description:
                                    before is a safe string representation
                                    of the previous value.
                                  type: string
                                path:
                                  description:
                                    path identifies the changed field in
                                    normalized Kubernetes object form.
                                  minLength: 1
                                  type: string
                                redacted:
                                  description:
                                    redacted indicates that the real value
                                    was intentionally hidden.
                                  type: boolean
                              required:
                                - path
                              type: object
                            type: array
                            x-kubernetes-list-type: atomic
                          conflicts:
                            description:
                              conflicts lists SSA ownership conflicts that
                              fail by default before mutation.
                            items:
                              description:
                                PlanConflict captures a server-side apply
                                ownership conflict detected before mutation.
                              properties:
                                manager:
                                  description:
                                    manager is the other field manager currently
                                    owning the field.
                                  minLength: 1
                                  type: string
                                path:
                                  description:
                                    path identifies the desired field that
                                    conflicts with another field manager.
                                  minLength: 1
                                  type: string
                                policy:
                                  description:
                                    policy records the conflict behavior
                                    that will be used by apply.
                                  enum:
                                    - fail
                                    - adopt
                                  type: string
                              required:
                                - manager
                                - path
                                - policy
                              type: object
                            type: array
                            x-kubernetes-list-type: atomic
                          destructive:
                            description:
                              destructive is true for deletes and other planned
                              operations that remove live state.
                            type: boolean
                          resource:
                            description:
                              ResourceRef identifies a Kubernetes resource
                              in a plan, graph, or status.
                            properties:
                              apiVersion:
                                description:
                                  apiVersion is the resource API version,
                                  such as apps/v1.
                                minLength: 1
                                type: string
                              kind:
                                description: kind is the Kubernetes resource kind.
                                minLength: 1
                                type: string
                              name:
                                description: name is the resource name.
                                minLength: 1
                                type: string
                              namespace:
                                description: namespace is empty for cluster-scoped resources.
                                type: string
                            required:
                              - apiVersion
                              - kind
                              - name
                            type: object
                          warnings:
                            description:
                              warnings carry conspicuous safety information
                              such as high-risk prune candidates.
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                        required:
                          - action
                          - resource
                        type: object
                      type: array
                      x-kubernetes-list-type: atomic
                    summary:
                      description:
                        PlanSummary is a bounded summary of planned resource
                        actions.
                      properties:
                        create:
                          format: int32
                          minimum: 0
                          type: integer
                        delete:
                          format: int32
                          minimum: 0
                          type: integer
                        truncated:
                          description:
                            truncated is true when detailed plan output was
                            bounded for etcd safety.
                          type: boolean
                        unchanged:
                          format: int32
                          minimum: 0
                          type: integer
                        update:
                          format: int32
                          minimum: 0
                          type: integer
                      type: object
                  type: object
                previousRevision:
                  description:
                    previousRevision references the prior healthy Revision
                    when known.
                  properties:
                    name:
                      description: name is the referenced object name.
                      minLength: 1
                      type: string
                  required:
                    - name
                  type: object
                startedAt:
                  description: startedAt records when processing began.
                  format: date-time
                  type: string
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
