---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-solder-io-v1alpha1-healthcheck
  failurePolicy: Fail
  name: vhealthcheck-v1alpha1.kb.io
  rules:
  - apiGroups:
    - solder.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - healthchecks
  sideEffects: None
