---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: webhook-service
        namespace: system
        path: /mutate-sync-kuvryn-io-v1alpha1-application
    failurePolicy: Fail
    name: mapplication-v1alpha1.kb.io
    rules:
      - apiGroups:
          - sync.kuvryn.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - applications
    sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: webhook-service
        namespace: system
        path: /validate-sync-kuvryn-io-v1alpha1-healthcheck
    failurePolicy: Fail
    name: vhealthcheck-v1alpha1.kb.io
    rules:
      - apiGroups:
          - sync.kuvryn.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - healthchecks
    sideEffects: None
