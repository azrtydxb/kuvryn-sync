---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: kuvryn-sync
    control-plane: controller-manager
  name: kuvryn-sync-controller-manager
  namespace: kuvryn-sync-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kuvryn-sync
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: kuvryn-sync
        control-plane: controller-manager
    spec:
      containers:
        - args:
            - --metrics-bind-address=:8443
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
          command:
            - /ksync
          image: ghcr.io/azrtydxb/kuvryn-sync:v0.7.0
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          name: manager
          ports:
            - containerPort: 8081
              name: health
              protocol: TCP
            - containerPort: 9443
              name: webhook-server
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: webhook-certs
              readOnly: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: kuvryn-sync-controller-manager
      terminationGracePeriodSeconds: 10
      volumes:
        - emptyDir: {}
          name: tmp
        - name: webhook-certs
          secret:
            secretName: webhook-server-cert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: kuvryn-sync
  name: kuvryn-sync-serving-cert
  namespace: kuvryn-sync-system
spec:
  dnsNames:
    - kuvryn-sync-webhook-service.kuvryn-sync-system.svc
    - kuvryn-sync-webhook-service.kuvryn-sync-system.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: kuvryn-sync-selfsigned-issuer
  secretName: webhook-server-cert
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: kuvryn-sync
  name: kuvryn-sync-selfsigned-issuer
  namespace: kuvryn-sync-system
spec:
  selfSigned: {}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: kuvryn-sync-system/kuvryn-sync-serving-cert
  name: kuvryn-sync-mutating-webhook-configuration
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: kuvryn-sync-webhook-service
        namespace: kuvryn-sync-system
        path: /mutate-sync-kuvryn-io-v1alpha1-application
    failurePolicy: Fail
    name: mapplication-v1alpha1.kb.io
    rules:
      - apiGroups:
          - sync.kuvryn.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - applications
    sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: kuvryn-sync-system/kuvryn-sync-serving-cert
  name: kuvryn-sync-validating-webhook-configuration
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: kuvryn-sync-webhook-service
        namespace: kuvryn-sync-system
        path: /validate-sync-kuvryn-io-v1alpha1-healthcheck
    failurePolicy: Fail
    name: vhealthcheck-v1alpha1.kb.io
    rules:
      - apiGroups:
          - sync.kuvryn.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - healthchecks
    sideEffects: None
