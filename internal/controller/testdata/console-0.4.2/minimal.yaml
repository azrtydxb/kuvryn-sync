---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: kuvryn-sync-console
  name: kuvryn-sync-kuvryn-sync-console
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kuvryn-sync-console
  name: kuvryn-sync-kuvryn-sync-console
rules:
  - apiGroups:
      - ""
    resources:
      - users
    verbs:
      - impersonate
  - apiGroups:
      - ""
    resources:
      - groups
    verbs:
      - impersonate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: kuvryn-sync-console
  name: kuvryn-sync-kuvryn-sync-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kuvryn-sync-kuvryn-sync-console
subjects:
  - kind: ServiceAccount
    name: kuvryn-sync-kuvryn-sync-console
    namespace: kuvryn-sync-system
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: kuvryn-sync-console
  name: kuvryn-sync-kuvryn-sync-console
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/instance: kuvryn-sync
    app.kubernetes.io/name: kuvryn-sync-console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: kuvryn-sync-console
  name: kuvryn-sync-kuvryn-sync-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: kuvryn-sync
      app.kubernetes.io/name: kuvryn-sync-console
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: kuvryn-sync
        app.kubernetes.io/name: kuvryn-sync-console
    spec:
      containers:
        - args:
            - console
            - --listen=:8080
            - --oidc-issuer-url=https://dex.example
            - --oidc-client-id=ksync
            - --redirect-url=https://console.example/auth/callback
            - --username-claim=email
            - --groups-claim=groups
            - --cluster-name=cluster
          image: ghcr.io/azrtydxb/kuvryn-sync:v0.4.2
          imagePullPolicy: IfNotPresent
          livenessProbe:
            tcpSocket:
              port: http
          name: console
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts: null
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: kuvryn-sync-kuvryn-sync-console
