<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kuvryn Sync console</title>
  </head>
  <body>
    <main>
      <h1>The console UI is not built</h1>
      <p>
        This <code>ksync</code> binary was built without the console's web
        interface, so only the JSON API under <code>/api/</code> is available.
      </p>
      <p>
        Build the interface with <code>make web-build</code>, which needs Node
        22, and then rebuild the binary. Release images always include it.
      </p>
    </main>
  </body>
</html>
