apiVersion: v1
kind: Service
metadata:
  name: {{ include "kuvryn-sync.fullname" . }}-metrics
  labels:
    app.kubernetes.io/name: {{ include "kuvryn-sync.name" . }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "kuvryn-sync.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: {{ ternary "https" "http" .Values.metrics.secure }}
      port: {{ .Values.metrics.port }}
      targetPort: metrics
