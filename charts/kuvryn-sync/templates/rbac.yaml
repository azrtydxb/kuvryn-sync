apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: '{{ include "kuvryn-sync.fullname" . }}-manager'
  labels:
    app.kubernetes.io/name: '{{ include "kuvryn-sync.name" . }}'
rules:
  - apiGroups: [""]
    resources: ["configmaps", "services"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["impersonate"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "statefulsets"]
    verbs: ["list", "watch"]
  - apiGroups: ["sync.kuvryn.io"]
    resources: ["healthchecks", "notificationsinks"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["sync.kuvryn.io"]
    resources: ["applications", "imagepolicies", "repositories", "revisions"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["sync.kuvryn.io"]
    resources:
      [
        "applications/finalizers",
        "imagepolicies/finalizers",
        "repositories/finalizers",
        "revisions/finalizers",
      ]
    verbs: ["update"]
  - apiGroups: ["sync.kuvryn.io"]
    resources:
      ["applications/status", "imagepolicies/status", "repositories/status", "revisions/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: '{{ include "kuvryn-sync.fullname" . }}-manager'
  labels:
    app.kubernetes.io/name: '{{ include "kuvryn-sync.name" . }}'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: '{{ include "kuvryn-sync.fullname" . }}-manager'
subjects:
  - kind: ServiceAccount
    name: '{{ include "kuvryn-sync.fullname" . }}'
    namespace: "{{ .Release.Namespace }}"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: '{{ include "kuvryn-sync.fullname" . }}-leader-election'
  labels:
    app.kubernetes.io/name: '{{ include "kuvryn-sync.name" . }}'
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: '{{ include "kuvryn-sync.fullname" . }}-leader-election'
  labels:
    app.kubernetes.io/name: '{{ include "kuvryn-sync.name" . }}'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: '{{ include "kuvryn-sync.fullname" . }}-leader-election'
subjects:
  - kind: ServiceAccount
    name: '{{ include "kuvryn-sync.fullname" . }}'
    namespace: "{{ .Release.Namespace }}"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: '{{ include "kuvryn-sync.fullname" . }}-metrics-reader'
  labels:
    app.kubernetes.io/name: '{{ include "kuvryn-sync.name" . }}'
rules:
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
