{{- if .Values.console.enabled }}
{{- $name := printf "%s-console" (include "kuvryn-sync.fullname" .) }}
{{- $c := .Values.console }}
{{- $sessionSecret := $c.sessionKey.secretName | default (printf "%s-session" $name) }}
{{- $redirect := $c.redirectURL }}
{{- if and (not $redirect) $c.ingress.enabled $c.ingress.host }}
{{- $redirect = printf "https://%s/auth/callback" $c.ingress.host }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: kuvryn-sync-console
---
# The console's only permission: impersonating the signed-in user and their
# groups. Every read it makes is the user's own, under their RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: kuvryn-sync-console
rules:
  - apiGroups: [""]
    resources: ["users", "groups"]
    verbs: ["impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: kuvryn-sync-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- if not $c.sessionKey.secretName }}
---
# The session cookie key, generated once and kept across upgrades.
{{- $existing := lookup "v1" "Secret" .Release.Namespace $sessionSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $sessionSecret }}
  labels:
    app.kubernetes.io/name: kuvryn-sync-console
type: Opaque
data:
  {{- if and $existing (index $existing.data $c.sessionKey.key) }}
  {{ $c.sessionKey.key }}: {{ index $existing.data $c.sessionKey.key }}
  {{- else }}
  {{ $c.sessionKey.key }}: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: kuvryn-sync-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kuvryn-sync-console
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kuvryn-sync-console
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - console
            - --listen=:8080
            - --oidc-issuer-url={{ required "console.oidc.issuerURL is required" $c.oidc.issuerURL }}
            - --oidc-client-id={{ required "console.oidc.clientID is required" $c.oidc.clientID }}
            {{- if $c.oidc.clientSecret.secretName }}
            - --oidc-client-secret-file=/etc/ksync/oidc/{{ $c.oidc.clientSecret.key }}
            {{- end }}
            {{- with $redirect }}
            - --redirect-url={{ . }}
            {{- end }}
            - --username-claim={{ $c.usernameClaim }}
            - --groups-claim={{ $c.groupsClaim }}
            {{- with $c.usernamePrefix }}
            - --username-prefix={{ . }}
            {{- end }}
            {{- with $c.groupsPrefix }}
            - --groups-prefix={{ . }}
            {{- end }}
            - --session-key-file=/etc/ksync/session/{{ $c.sessionKey.key }}
            - --cluster-name={{ $c.clusterName }}
            {{- with $c.ssoName }}
            - --sso-name={{ . }}
            {{- end }}
            {{- with $c.connectors }}
            - --connectors={{ join "," . }}
            {{- end }}
            {{- with $c.docsURL }}
            - --docs-url={{ . }}
            {{- end }}
            {{- with $c.statusURL }}
            - --status-url={{ . }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
{{ toYaml $c.resources | indent 12 }}
          volumeMounts:
            - name: session
              mountPath: /etc/ksync/session
              readOnly: true
            {{- if $c.oidc.clientSecret.secretName }}
            - name: oidc
              mountPath: /etc/ksync/oidc
              readOnly: true
            {{- end }}
          # /healthz is 503 until OIDC discovery succeeds.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            tcpSocket:
              port: http
      volumes:
        - name: session
          secret:
            secretName: {{ $sessionSecret }}
        {{- if $c.oidc.clientSecret.secretName }}
        - name: oidc
          secret:
            secretName: {{ $c.oidc.clientSecret.secretName }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: kuvryn-sync-console
spec:
  selector:
    app.kubernetes.io/name: kuvryn-sync-console
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if $c.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: kuvryn-sync-console
  {{- with $c.ingress.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  {{- with $c.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $c.ingress.tls }}
  tls:
{{ toYaml . | indent 4 }}
  {{- end }}
  rules:
    - host: {{ required "console.ingress.host is required when the ingress is enabled" $c.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
{{- end }}
{{- end }}
