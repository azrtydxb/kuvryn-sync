{{- if .Values.console.enabled }}
{{- $name := printf "%s-console" (include "kuvryn-sync.fullname" .) }}
{{- $c := .Values.console }}
{{- if and (gt (int $c.replicas) 1) (not $c.sessionKey.secretName) }}
{{- fail "console.replicas > 1 needs console.sessionKey.secretName: without a shared session key each replica keeps its own in memory, and a user's session works on only one of them" }}
{{- end }}
{{- /* Token sign-in is always on. OIDC is optional: set both values or neither. */}}
{{- $oidc := or $c.oidc.issuerURL $c.oidc.clientID }}
{{- if and $oidc (not (and $c.oidc.issuerURL $c.oidc.clientID)) }}
{{- fail "console.oidc.issuerURL and console.oidc.clientID must be set together, or both left empty for token sign-in only" }}
{{- end }}
{{- $redirect := $c.redirectURL }}
{{- if and (not $redirect) $c.ingress.enabled $c.ingress.host }}
{{- $redirect = printf "https://%s/auth/callback" $c.ingress.host }}
{{- end }}
{{- if and $oidc (not $redirect) }}
{{- fail "console.redirectURL is required: set it, or enable console.ingress with a host to derive https://<host>/auth/callback" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: kuvryn-sync-console
{{- if $oidc }}
---
# The console's only permission: impersonating the signed-in user and their
# groups. Every read it makes is the user's own, under their RBAC. Without
# console.impersonation lists this may impersonate anyone, system:masters
# included, so whoever holds the console's token can act as cluster-admin.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: kuvryn-sync-console
rules:
  - apiGroups: [""]
    resources: ["users"]
    verbs: ["impersonate"]
    {{- with $c.impersonation.users }}
    resourceNames:
{{ toYaml . | indent 6 }}
    {{- end }}
  - apiGroups: [""]
    resources: ["groups"]
    verbs: ["impersonate"]
    {{- with $c.impersonation.groups }}
    resourceNames:
{{ toYaml . | indent 6 }}
    {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: kuvryn-sync-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: kuvryn-sync-console
spec:
  replicas: {{ $c.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: kuvryn-sync-console
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kuvryn-sync-console
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ $name }}
      {{- with $.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - console
            - --listen=:8080
            {{- if $oidc }}
            - --oidc-issuer-url={{ $c.oidc.issuerURL }}
            - --oidc-client-id={{ $c.oidc.clientID }}
            {{- if $c.oidc.clientSecret.secretName }}
            - --oidc-client-secret-file=/etc/ksync/oidc/{{ $c.oidc.clientSecret.key }}
            {{- end }}
            {{- with $redirect }}
            - --redirect-url={{ . }}
            {{- end }}
            - --username-claim={{ $c.usernameClaim }}
            - --groups-claim={{ $c.groupsClaim }}
            {{- with $c.usernamePrefix }}
            - --username-prefix={{ . }}
            {{- end }}
            {{- with $c.groupsPrefix }}
            - --groups-prefix={{ . }}
            {{- end }}
            {{- end }}
            {{- if $c.sessionKey.secretName }}
            - --session-key-file=/etc/ksync/session/{{ $c.sessionKey.key }}
            {{- end }}
            - --cluster-name={{ $c.clusterName }}
            {{- if $oidc }}
            {{- with $c.ssoName }}
            - --sso-name={{ . }}
            {{- end }}
            {{- with $c.connectors }}
            - --connectors={{ join "," . }}
            {{- end }}
            {{- end }}
            {{- with $c.docsURL }}
            - --docs-url={{ . }}
            {{- end }}
            {{- with $c.statusURL }}
            - --status-url={{ . }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
{{ toYaml $c.resources | indent 12 }}
          volumeMounts:
            {{- if $c.sessionKey.secretName }}
            - name: session
              mountPath: /etc/ksync/session
              readOnly: true
            {{- end }}
            {{- if and $oidc $c.oidc.clientSecret.secretName }}
            - name: oidc
              mountPath: /etc/ksync/oidc
              readOnly: true
            {{- end }}
          {{- if $oidc }}
          # /healthz is 503 until OIDC discovery succeeds.
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            tcpSocket:
              port: http
      {{- if or $c.sessionKey.secretName (and $oidc $c.oidc.clientSecret.secretName) }}
      volumes:
        {{- if $c.sessionKey.secretName }}
        - name: session
          secret:
            secretName: {{ $c.sessionKey.secretName }}
        {{- end }}
        {{- if and $oidc $c.oidc.clientSecret.secretName }}
        - name: oidc
          secret:
            secretName: {{ $c.oidc.clientSecret.secretName }}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: kuvryn-sync-console
spec:
  selector:
    app.kubernetes.io/name: kuvryn-sync-console
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if $c.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: kuvryn-sync-console
  {{- with $c.ingress.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  {{- with $c.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $c.ingress.tls }}
  tls:
{{ toYaml . | indent 4 }}
  {{- end }}
  rules:
    - host: {{ required "console.ingress.host is required when the ingress is enabled" $c.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
{{- end }}
{{- end }}
