image:
  repository: ghcr.io/azrtydxb/kuvryn-sync
  # Defaults to v<appVersion> from Chart.yaml. The chart passes flags that
  # only the image of the same release understands, so override this only
  # with an image built from the same commit.
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 2
leaderElection: true

# Service account (in each Application's namespace) that Kuvryn Sync impersonates
# when an Application sets no spec.serviceAccountName. Leave empty to refuse
# such Applications.
defaultServiceAccount: ""

# How often Applications that manage kinds the controller may not watch are
# re-checked for drift. Grant the controller list/watch on a kind to get
# immediate drift detection for it instead.
driftResyncInterval: 5m

# Receiver for push webhooks, served by the Service <release>-kuvryn-sync-receiver
# on port 80: GitHub/GitLab pushes at POST /hooks/<namespace>/<repository>,
# and registry pushes at POST /hooks/imagepolicies/<namespace>/<name>. Expose
# the Service through your ingress; requests are authenticated per object with
# its spec.webhook.secretRef.
webhookReceiver:
  enabled: false

# Extra environment variables for the manager container, for example the
# OpenTelemetry exporter settings that turn on tracing:
#   extraEnv:
#     - name: OTEL_EXPORTER_OTLP_ENDPOINT
#       value: http://otel-collector.observability:4317
extraEnv: []

# Each replica caches Git checkouts and pulled Helm charts in an emptyDir at
# /tmp, pruned hourly to what retained Revisions and Repositories still use.
# Add an ephemeral-storage request and limit here if node disk is tight.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
