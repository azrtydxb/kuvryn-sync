image:
  repository: ghcr.io/azrtydxb/kuvryn-sync
  # Defaults to v<appVersion> from Chart.yaml. The chart passes flags that
  # only the image of the same release understands, so override this only
  # with an image built from the same commit.
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 2
leaderElection: true

# Service account (in each Application's namespace) that Kuvryn Sync impersonates
# when an Application sets no spec.serviceAccountName. Leave empty to refuse
# such Applications.
defaultServiceAccount: ""

# How often Applications that manage kinds the controller may not watch are
# re-checked for drift. Grant the controller list/watch on a kind to get
# immediate drift detection for it instead.
driftResyncInterval: 5m

# Receiver for push webhooks, served by the Service <release>-kuvryn-sync-receiver
# on port 80: GitHub/GitLab pushes at POST /hooks/<namespace>/<repository>,
# and registry pushes at POST /hooks/imagepolicies/<namespace>/<name>. Expose
# the Service through your ingress; requests are authenticated per object with
# its spec.webhook.secretRef.
webhookReceiver:
  enabled: false

# Extra environment variables for the manager container, for example the
# OpenTelemetry exporter settings that turn on tracing:
#   extraEnv:
#     - name: OTEL_EXPORTER_OTLP_ENDPOINT
#       value: http://otel-collector.observability:4317
extraEnv: []

# Each replica caches Git checkouts and pulled Helm charts in an emptyDir at
# /tmp, pruned hourly to what retained Revisions and Repositories still use.
# Add an ephemeral-storage request and limit here if node disk is tight.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# The read-only web console (ksync console), off by default. It runs as its
# own Deployment and ServiceAccount, whose only permission is to impersonate
# users and groups: every read is made as the signed-in user, so what a person
# sees follows their own Kubernetes RBAC. See docs/console.md.
#
# WARNING: impersonating any user or group includes system:masters, so
# whoever holds the console ServiceAccount's token can act as cluster-admin.
# The console itself refuses system: identities, but Kubernetes does not.
# Lock down the release namespace (pod exec, pod create, Secret reads), and
# list the users and groups the console may impersonate in
# console.impersonation when you can.
console:
  enabled: false
  # More than one replica needs sessionKey.secretName.
  replicas: 1
  # Restrict whom the console may impersonate. Each non-empty list becomes
  # resourceNames on its impersonate rule; an empty list leaves that kind
  # unrestricted. Sign-ins with a username or group outside the lists fail
  # with Forbidden on every read.
  impersonation:
    users: []
    groups: []
  oidc:
    # OIDC issuer, for example Dex: https://dex.example.com
    issuerURL: ""
    clientID: ""
    # Secret holding the OIDC client secret. Leave secretName empty for a
    # public client; PKCE protects the code exchange either way.
    clientSecret:
      secretName: ""
      key: client-secret
  # Where the issuer sends users back: https://<host>/auth/callback. Defaults
  # to that URL on ingress.host when the ingress is enabled.
  redirectURL: ""
  # ID token claims mapped to the impersonated username and groups, and the
  # prefixes added to them. With empty prefixes, RBAC bindings name users and
  # groups exactly as the issuer sends them.
  usernameClaim: email
  groupsClaim: groups
  usernamePrefix: ""
  groupsPrefix: ""
  # Secret holding the 32-byte key that encrypts the session cookie, mounted
  # only when secretName is set. Without it the console generates a random
  # key in memory at startup: every restart signs everyone out, and replicas
  # cannot share sessions, so replicas > 1 requires a secretName. The chart
  # never generates the key itself, so it renders the same every time, as a
  # GitOps controller needs. Rotating the key signs everyone out.
  sessionKey:
    secretName: ""
    key: session-key
  # Shown in the console and on the login page.
  clusterName: cluster
  # Names the login page's "Sign in with" button, for example Dex.
  ssoName: ""
  # Dex connectors offered as extra sign-in buttons: github, gitlab, local.
  connectors: []
  docsURL: ""
  statusURL: ""
  ingress:
    enabled: false
    className: ""
    host: ""
    annotations: {}
    # For example: [{secretName: console-tls, hosts: [console.example.com]}]
    tls: []
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
