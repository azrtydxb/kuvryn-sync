image:
  repository: ghcr.io/azrtydxb/solder
  tag: v0.1.11
  pullPolicy: IfNotPresent

replicaCount: 2
leaderElection: true

# Service account (in each Application's namespace) that Solder impersonates
# when an Application sets no spec.serviceAccountName. Leave empty to refuse
# such Applications.
defaultServiceAccount: ""

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
